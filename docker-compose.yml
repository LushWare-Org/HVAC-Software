version: "3.9"

# ============================================================
# T&S CRM — Docker Compose (INFRASTRUCTURE ONLY)
# Services (NestJS apps) run on the HOST for hot-reload.
# This file brings up: PostgreSQL, Redis, MongoDB, MinIO, Nginx
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 16 with PostGIS extension
  # All 5 schemas created by init.sql on first startup
  # ----------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tscrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tscrm
      POSTGRES_USER: tscrm_user
      POSTGRES_PASSWORD: tscrm_pass
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tscrm_user -d tscrm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis 7 — BullMQ queues + Socket.IO adapter + caching
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tscrm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # MongoDB 7 — Communication service (message threads, logs)
  # Runs as a single-node replica set so Prisma transactions work.
  # On first boot the mongo-init container calls rs.initiate().
  # ----------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: tscrm_mongodb
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - ./.docker-data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # MinIO — S3-compatible object storage (photos, PDFs, docs)
  # Console UI: http://localhost:9001  (admin/minioadmin)
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: tscrm_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker-data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Nginx — API Gateway (dev)
  # Routes /api/<service>/* → host.docker.internal:<port>
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: tscrm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # pgAdmin 4 — web-based PostgreSQL GUI
  # Browse ALL schemas (crm, finance, jobs, analytics...) in one place
  # UI: http://localhost:5050  (admin@tscrm.local / admin)
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tscrm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tscrm.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - ./.docker-data/pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: tscrm_network
