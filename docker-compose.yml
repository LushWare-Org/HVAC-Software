# ============================================================
# T&S CRM — Docker Compose (INFRASTRUCTURE ONLY)
# Database:  Supabase (cloud PostgreSQL) — no local Postgres
# Services (NestJS apps) run on the HOST for hot-reload.
# This file brings up: PostgreSQL, Redis, MongoDB, MinIO, Nginx, churn inference
# ============================================================

services:
  # ----------------------------------------------------------
  # Redis 7 — BullMQ queues + Socket.IO adapter + caching
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tscrm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # MinIO — S3-compatible object storage (photos, PDFs, docs)
  # Console UI: http://localhost:9001  (admin/minioadmin)
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: tscrm_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker-data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Churn Service — FastAPI inference used by CRM follow-ups
  # Host CRM dev process reaches this at http://localhost:8000
  # ----------------------------------------------------------
  churn-service:
    build:
      context: ./apps/churn-service
    container_name: tscrm_churn_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Nginx — API Gateway (dev)
  # Routes /api/<service>/* → host.docker.internal:<port>
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: tscrm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # RedisInsight — web-based Redis GUI
  # Browse queues, cached data, pub/sub channels
  # UI: http://localhost:5540
  # ----------------------------------------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: tscrm_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis

networks:
  default:
    name: tscrm_network
