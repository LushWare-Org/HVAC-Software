# ============================================================
# T&S CRM — Docker Compose (INFRASTRUCTURE ONLY)
# Database:  Supabase (cloud PostgreSQL) — no local Postgres
# Services (NestJS apps) run on the HOST for hot-reload.
# This file brings up: Redis, MinIO, Nginx, ML Backend
# ============================================================

services:
  # ----------------------------------------------------------
  # Redis 7 — BullMQ queues + Socket.IO adapter + caching
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tscrm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # MinIO — S3-compatible object storage (photos, PDFs, docs)
  # Console UI: http://localhost:9001  (admin/minioadmin)
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: tscrm_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker-data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # ML Backend — FastAPI + XGBoost HVAC failure prediction
  # API: http://localhost:8000
  # ----------------------------------------------------------
  ml-backend:
    build:
      context: ./ml-backend
      dockerfile: Dockerfile
    container_name: tscrm_ml_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount models directory to preserve trained models without rebuild
      - ./ml-backend/models:/app/models
      # Mount main.py for instant code updates (no rebuild needed)
      - ./ml-backend/main.py:/app/main.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # Nginx — API Gateway (dev)
  # Routes /api/<service>/* → host.docker.internal:<port>
  # Also routes /predict and /ml/* to ml-backend
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: tscrm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - ml-backend
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # RedisInsight — web-based Redis GUI
  # Browse queues, cached data, pub/sub channels
  # UI: http://localhost:5540
  # ----------------------------------------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: tscrm_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis

  # ----------------------------------------------------------
  # Mosquitto — MQTT Broker for IoT sensor data
  # Real-time sensor data streaming from IoT devices
  # Topic: hvac/equipment/+/sensor_data
  # ----------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: tscrm_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"  # MQTT protocol
      - "9002:9001"  # WebSocket (changed to 9002 to avoid MinIO conflict)
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./.docker-data/mosquitto/data:/mosquitto/data
      - ./.docker-data/mosquitto/logs:/mosquitto/log
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD", "sh", "-c", "mosquitto_sub -h 127.0.0.1 -t '\\$SYS/broker/clients/total' -C 1 -W 1"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 10s

  # ----------------------------------------------------------
  # MQTT Consumer — Real-time ML prediction pipeline
  # Listens to MQTT → Calls ML API → Stores predictions in DB
  # Bridges: IoT Sensors → ML → Dashboard
  # ----------------------------------------------------------
  mqtt-consumer:
    build:
      context: ./ml-backend
      dockerfile: Dockerfile.mqtt-consumer
    container_name: tscrm_mqtt_consumer
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - ML_API_URL=http://ml-backend:8000/predict
    depends_on:
      - mosquitto
      - ml-backend
    volumes:
      - ./ml-backend/models:/app/models:ro
    healthcheck:
      test: ["CMD", "ps", "aux"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: tscrm_network