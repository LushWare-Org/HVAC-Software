worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # ============================================================
  # T&S CRM — Nginx API Gateway (Development)
  # Services run on host. Nginx routes by path prefix.
  # host.docker.internal resolves to the Mac host machine.
  # ============================================================

  upstream crm_service {
    server host.docker.internal:3001;
  }

  upstream job_service {
    server host.docker.internal:3002;
  }

  upstream scheduling_service {
    server host.docker.internal:3003;
  }

  upstream finance_service {
    server host.docker.internal:3004;
  }

  upstream comms_service {
    server host.docker.internal:3005;
  }

  upstream analytics_service {
    server host.docker.internal:3006;
  }

  server {
    listen 80;
    server_name localhost;

    # ---- CORS headers (dev only — Kong handles prod) ----
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Company-ID' always;

    # Preflight
    if ($request_method = OPTIONS) {
      return 204;
    }

    # ---- Health check (Nginx itself) ----
    location /health {
      return 200 '{"status":"ok","gateway":"nginx"}';
      add_header Content-Type application/json;
    }

    # ---- CRM & Customer Service ----
    location /api/crm/ {
      proxy_pass http://crm_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Job Management Service ----
    location /api/jobs/ {
      proxy_pass http://job_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Scheduling & Dispatch Service ----
    location /api/scheduling/ {
      proxy_pass http://scheduling_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Finance Service ----
    location /api/finance/ {
      proxy_pass http://finance_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Communication Service ----
    location /api/comms/ {
      proxy_pass http://comms_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Analytics Service ----
    location /api/analytics/ {
      proxy_pass http://analytics_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket (Socket.IO — real-time dispatch board) ----
    location /socket.io/ {
      proxy_pass http://scheduling_service/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # ---- Default: 404 ----
    location / {
      return 404 '{"error":"route not found"}';
      add_header Content-Type application/json;
    }
  }
}
