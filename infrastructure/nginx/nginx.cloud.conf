worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 169.254.169.254 valid=30s ipv6=off;

    # Rate limiting — 60 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    server {
        listen 8080;

        # ── Global CORS headers ────────────────────────────────────────────────
        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-test-company-id, x-test-user-role, x-test-user-id, x-test-user-name" always;
        add_header Access-Control-Allow-Credentials "true" always;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        # ── Health check ──────────────────────────────────────────────────────
        location = /health {
            return 200 '{"status":"ok","gateway":"nginx-cloud"}';
            add_header Content-Type application/json;
        }

        # ── CRM Service ───────────────────────────────────────────────────────
        # Strips /api/crm/ prefix — crm-service routes are /auth/login, /customers, etc.
        location ~ ^/api/crm/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${CRM_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Jobs Service ──────────────────────────────────────────────────────
        location ~ ^/api/jobs/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${JOBS_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
        }

        # ── Scheduling Service ────────────────────────────────────────────────
        location ~ ^/api/scheduling/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${SCHEDULING_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
        }

        # ── Finance Service ───────────────────────────────────────────────────
        location ~ ^/api/finance/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${FINANCE_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
        }

        # ── Comms Service ─────────────────────────────────────────────────────
        location ~ ^/api/comms/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${COMMS_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
        }

        # ── Inventory Service ─────────────────────────────────────────────────
        location ~ ^/api/inventory/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${INVENTORY_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
        }

        # ── Analytics sub-routes — MUST come BEFORE generic /api/analytics/ ──

        # Bandit observability (→ agent-service /bandit/*)
        location ~ ^/api/analytics/bandit-api/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${AGENT_SERVICE_URL}";
            proxy_pass $upstream/bandit/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
        }

        # Revenue agent analytics (→ agent-service /analytics/*)
        location ~ ^/api/analytics/revenue-agent-api/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${AGENT_SERVICE_URL}";
            proxy_pass $upstream/analytics/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
        }

        # General analytics service
        location ~ ^/api/analytics/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${ANALYTICS_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
        }

        # ── Chat Service (SSE streaming — buffering off) ─────────────────────────
        location ~ ^/api/chat/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${CHAT_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }

        # ── AI/ML Services ────────────────────────────────────────────────────

        location ~ ^/api/churn/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${CHURN_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/api/agent/(.*)$ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${AGENT_SERVICE_URL}";
            proxy_pass $upstream/$1$is_args$args;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
        }

        # Fallback for CRM auth routes that arrive without /api/crm/ prefix.
        location /auth/ {
            if ($request_method = OPTIONS) { return 204; }
            set $upstream "${CRM_SERVICE_URL}";
            proxy_pass $upstream;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── WebSocket (dispatch live GPS) ──────────────────────────────────
        location /ws {
            set $upstream "${SCHEDULING_SERVICE_URL}";
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_read_timeout 3600s;
        }

        # ── Socket.IO (comms real-time) ────────────────────────────────────
        location /socket.io/ {
            set $upstream "${COMMS_SERVICE_URL}";
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_read_timeout 3600s;
        }

        # ── Meta Lead Webhook (CRM service, no auth guard) ───────────────────
        # ── Marketing public + webhook endpoints (comms service, no auth guard) ──
        # /m/u/:token  — one-click unsubscribe
        # /m/r/:token  — click redirect tracking
        # /m/webhooks/ — SendGrid + Twilio callbacks
        location ^~ /m/ {
            set $upstream "${COMMS_SERVICE_URL}";
            proxy_pass $upstream/m/;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Meta POSTs lead events here. CRM service verifies X-Hub-Signature-256.
        # Register this URL in Meta App Dashboard → Webhooks → Page → leadgen
        location = /api/crm/meta/webhook {
            set $upstream "${CRM_SERVICE_URL}";
            proxy_pass $upstream/meta/webhook;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Stripe Webhook (finance service, no auth guard) ──────────────────
        # Stripe POSTs here; the finance service verifies the stripe-signature header.
        # MUST be registered in the Stripe Dashboard as:
        #   https://<gateway-host>/webhooks/stripe
        location = /webhooks/stripe {
            set $upstream "${FINANCE_SERVICE_URL}";
            proxy_pass $upstream/webhooks/stripe;
            proxy_set_header Host $proxy_host;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Default 404 ──────────────────────────────────────────────────────
        location / {
            return 404 '{"error":"route not found","gateway":"nginx-cloud"}';
            add_header Content-Type application/json;
        }
    }
}
