# Mosquitto Configuration for HVAC IoT System
# Version: 2.1.2

# Port to listen on
listener 1883
protocol mqtt

# WebSocket listener
listener 9883
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Log settings
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# System messages - Required for health checks
sys_interval 60

# Max connections
max_connections -1

# Security settings
allow_anonymous true
